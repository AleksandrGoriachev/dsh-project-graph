<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="'Segoe UI Variable Display','Segoe UI',Inter,Arial,sans-serif" role="img" aria-label="Правило крестика"><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.6"/></filter><marker id="ar-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4d7cf3"/></marker><marker id="ar-folder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3bbbd0"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e0a33e"/></marker><marker id="ar-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a8aeb8"/></marker><marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#31c46e"/></marker><marker id="ar-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/></marker></defs><rect x="0" y="0" width="1440" height="900" rx="0" fill="#141518"/><text x="40" y="62" fill="#e9ebee" font-size="24" font-weight="600">Правило крестика</text><text x="40" y="90" fill="#a8aeb8" font-size="14" font-weight="400">одно правило для трёх окон: «Сведения об узле», «Редактировать узел», «Папка обмена»</text><rect x="40" y="120" width="320" height="96" rx="12" fill="#17191c" stroke="#2c3037" stroke-width="1"/><rect x="60" y="144" width="32" height="32" rx="8" fill="rgba(229,72,77,0.14)" stroke="rgba(229,72,77,0.5)" stroke-width="1"/><line x1="69" y1="153" x2="83" y2="167" stroke="#e5484d" stroke-width="2"/><line x1="83" y1="153" x2="69" y2="167" stroke="#e5484d" stroke-width="2"/><text x="104" y="158" fill="#e9ebee" font-size="15" font-weight="600">Закрытие окна</text><text x="104" y="180" fill="#7d848f" font-size="12" font-weight="400">крестик · Esc · клик вне окна</text><text x="60" y="204" fill="#626974" font-size="11" font-weight="400">три способа — одно поведение</text><rect x="40" y="256" width="320" height="104" rx="12" fill="#17191c" stroke="rgba(77,124,243,0.55)" stroke-width="1"/><text x="60" y="294" fill="#e9ebee" font-size="15" font-weight="600">Есть несохранённые правки?</text><text x="60" y="316" fill="#7d848f" font-size="11" font-weight="400">поля, расписание, связи, метки</text><text x="60" y="338" fill="#626974" font-size="11" font-weight="400">сравнение с моментом открытия окна</text><path d="M200 216 L200 256" fill="none" stroke="#a8aeb8" stroke-width="2" marker-end="url(#ar-sec)" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 308 L470 308" fill="none" stroke="#31c46e" stroke-width="2" marker-end="url(#ar-ok)" stroke-linecap="round" stroke-linejoin="round"/><text x="368" y="300" fill="#31c46e" font-size="12" font-weight="600">нет правок</text><rect x="480" y="256" width="320" height="104" rx="12" fill="#17191c" stroke="#2c3037" stroke-width="1"/><text x="500" y="294" fill="#e9ebee" font-size="15" font-weight="600">Закрыть сразу</text><text x="500" y="316" fill="#7d848f" font-size="12" font-weight="400">диалога нет: правок не было</text><text x="500" y="338" fill="#626974" font-size="11" font-weight="400">окно исчезает, структура не тронута</text><path d="M200 360 L200 420" fill="none" stroke="#e0a33e" stroke-width="2" marker-end="url(#ar-warn)" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="396" fill="#e0a33e" font-size="12" font-weight="600">правки есть</text><rect x="40" y="420" width="380" height="120" rx="12" fill="#17191c" stroke="rgba(224,163,62,0.55)" stroke-width="1"/><text x="60" y="456" fill="#e9ebee" font-size="15" font-weight="600">Диалог подтверждения</text><text x="60" y="482" fill="#e9ebee" font-size="13" font-weight="400">«Изменения не сохранятся.</text><text x="60" y="502" fill="#e9ebee" font-size="13" font-weight="400">Закрыть без сохранения?»</text><text x="60" y="528" fill="#626974" font-size="11" font-weight="400">две кнопки, без третьего пути</text><path d="M420 450 L520 450" fill="none" stroke="#e5484d" stroke-width="2" marker-end="url(#ar-danger)" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="400" width="340" height="120" rx="12" fill="#17191c" stroke="#2c3037" stroke-width="1"/><text x="540" y="428" fill="#e5484d" font-size="11" font-weight="400">«Закрыть без сохранения»</text><text x="540" y="452" fill="#e9ebee" font-size="15" font-weight="600">Окно закрыто</text><text x="540" y="476" fill="#7d848f" font-size="11" font-weight="400">правки отброшены, структура как была</text><text x="540" y="496" fill="#626974" font-size="11" font-weight="400">фокус — на карточке узла</text><path d="M420 510 H470 V610 H520" fill="none" stroke="#4d7cf3" stroke-width="2" marker-end="url(#ar-accent)" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="560" width="340" height="120" rx="12" fill="#17191c" stroke="#2c3037" stroke-width="1"/><text x="540" y="588" fill="#4d7cf3" font-size="11" font-weight="400">«Продолжить редактирование»</text><text x="540" y="612" fill="#e9ebee" font-size="15" font-weight="600">Окно открыто</text><text x="540" y="636" fill="#7d848f" font-size="11" font-weight="400">правки на месте, ничего не потеряно</text><text x="540" y="656" fill="#626974" font-size="11" font-weight="400">фокус — в первом изменённом поле</text><rect x="920" y="120" width="480" height="196" rx="12" fill="#17191c" stroke="#2c3037" stroke-width="1"/><text x="940" y="150" fill="#e9ebee" font-size="14" font-weight="600">Крестик в окне</text><rect x="940" y="166" width="440" height="44" rx="10" fill="#22252b" stroke="#3a3f47" stroke-width="1"/><text x="956" y="194" fill="#e9ebee" font-size="13" font-weight="600">Редактировать узел</text><rect x="1332" y="174" width="34" height="34" rx="9" fill="rgba(229,72,77,0.16)" stroke="rgba(229,72,77,0.55)" stroke-width="1"/><line x1="1342" y1="184" x2="1356" y2="198" stroke="#e5484d" stroke-width="2"/><line x1="1356" y1="184" x2="1342" y2="198" stroke="#e5484d" stroke-width="2"/><path d="M1349 208 L1349 224" fill="none" stroke="#a8aeb8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1250" y="224" width="132" height="28" rx="7" fill="#2c3037" stroke="#4a505a" stroke-width="1"/><text x="1316" y="243" fill="#a8aeb8" font-size="11" font-weight="400" text-anchor="middle">Закрыть без сохранения</text><text x="940" y="286" fill="#7d848f" font-size="11" font-weight="400">36×36, подсказка при наведении;</text><text x="940" y="304" fill="#7d848f" font-size="11" font-weight="400">рядом с кнопками окна не размещается ниже 56 px</text><rect x="40" y="700" width="432" height="64" rx="10" fill="#1b1e22" stroke="#2c3037" stroke-width="1"/><rect x="40" y="714" width="3" height="36" rx="1.5" fill="#4d7cf3"/><text x="58" y="726" fill="#e9ebee" font-size="13" font-weight="600">Крестик = закрыть без сохранения</text><text x="58" y="747" fill="#7d848f" font-size="11" font-weight="400">ничего не пишется в structure/*.json</text><rect x="496" y="700" width="432" height="64" rx="10" fill="#1b1e22" stroke="#2c3037" stroke-width="1"/><rect x="496" y="714" width="3" height="36" rx="1.5" fill="#4d7cf3"/><text x="514" y="726" fill="#e9ebee" font-size="13" font-weight="600">Правок нет — закрывает сразу</text><text x="514" y="747" fill="#7d848f" font-size="11" font-weight="400">диалог не показывается</text><rect x="952" y="700" width="432" height="64" rx="10" fill="#1b1e22" stroke="#2c3037" stroke-width="1"/><rect x="952" y="714" width="3" height="36" rx="1.5" fill="#4d7cf3"/><text x="970" y="726" fill="#e9ebee" font-size="13" font-weight="600">Правки есть — спрашивает</text><text x="970" y="747" fill="#7d848f" font-size="11" font-weight="400">«Закрыть без сохранения» / «Продолжить»</text><rect x="40" y="772" width="432" height="64" rx="10" fill="#1b1e22" stroke="#2c3037" stroke-width="1"/><rect x="40" y="786" width="3" height="36" rx="1.5" fill="#31c46e"/><text x="58" y="798" fill="#e9ebee" font-size="13" font-weight="600">«Сохранить» закрывает без диалога</text><text x="58" y="819" fill="#7d848f" font-size="11" font-weight="400">запись уже сделана</text><rect x="496" y="772" width="432" height="64" rx="10" fill="#1b1e22" stroke="#2c3037" stroke-width="1"/><rect x="496" y="786" width="3" height="36" rx="1.5" fill="#31c46e"/><text x="514" y="798" fill="#e9ebee" font-size="13" font-weight="600">Esc и клик вне окна = крестик</text><text x="514" y="819" fill="#7d848f" font-size="11" font-weight="400">то же правило, тот же диалог</text><rect x="952" y="772" width="432" height="64" rx="10" fill="#1b1e22" stroke="#2c3037" stroke-width="1"/><rect x="952" y="786" width="3" height="36" rx="1.5" fill="#31c46e"/><text x="970" y="798" fill="#e9ebee" font-size="13" font-weight="600">Фокус после диалога — в правке</text><text x="970" y="819" fill="#7d848f" font-size="11" font-weight="400">первое изменённое поле подсвечено</text><rect x="0" y="870" width="1440" height="30" rx="0" fill="#0d0e11"/><text x="20" y="889" fill="#626974" font-size="11" font-weight="400">Макет 06 · Правило крестика: без правок — сразу, с правками — подтверждение</text><text x="1420" y="889" fill="#4e545e" font-size="11" font-weight="400" text-anchor="end" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">docs/design/0018-panel/06-close-rule.svg</text></svg>
