<text x="77" y="1072" fill="#a8aeb8" font-size="11.5" font-weight="400" >Перетащите карточку на схему.</text>
<text x="77" y="1090" fill="#626974" font-size="10.5" font-weight="400" >или возьмите её с клавиатуры.</text>
