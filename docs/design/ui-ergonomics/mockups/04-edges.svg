<title>04 · Назначение связи: source → target и предпросмотр стрелки</title>
<desc>Макет для утверждения: карточка «Новая связь» 520 px, два select source/target, кнопка обмена, вид связи, полоса предпросмотра 48 px, список связей узла.</desc>
<defs>
