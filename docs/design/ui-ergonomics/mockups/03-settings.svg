<rect x="40" y="892" width="440" height="238" rx="12" fill="#1b1e24" stroke="#2a2f37"/>
<text x="58" y="918" fill="#e9ebee" font-size="13" font-weight="700" >① Окно, слои и границы</text>
<text x="58" y="944" fill="#a8aeb8" font-size="11" font-weight="400" >размер — 560 × 520 px, radius 12 px</text>
<text x="58" y="966" fill="#a8aeb8" font-size="11" font-weight="400" >подложка — rgba(20,22,26,0.22), z-index 60</text>
<text x="58" y="988" fill="#a8aeb8" font-size="11" font-weight="400" >окно — position: fixed, z-index 61</text>
<text x="58" y="1010" fill="#a8aeb8" font-size="11" font-weight="400" >удаление — z-index 70; закрытие с правками — 80</text>
<text x="58" y="1032" fill="'Cascadia Mono','Consolas',monospace" font-size="10" font-weight="400" >отступ от края — 8 px; clamp(left, 8, vw − w − 8)</text>
<text x="58" y="1054" fill="#a8aeb8" font-size="11" font-weight="400" >узкий экран &lt; 600 px — width: 100vw − 16, left = 8</text>
<text x="58" y="1076" fill="#a8aeb8" font-size="11" font-weight="400" >низкий экран &lt; 560 px — height: 100vh − 16, top = 8</text>
<text x="58" y="1104" fill="#626974" font-size="10.5" font-weight="400" >Строка структуры: в покое «4 узла · 5 связей»,</text>
<text x="58" y="1120" fill="#626974" font-size="10.5" font-weight="400" >после сохранения — «сохранено: …» (role="status").</text>

<rect x="500" y="892" width="440" height="238" rx="12" fill="#1b1e24" stroke="#2a2f37"/>
<text x="518" y="918" fill="#e9ebee" font-size="13" font-weight="700" >② Перетаскивание и память позиции</text>
<text x="518" y="944" fill="#a8aeb8" font-size="11" font-weight="400" >ручка — 12 × 12 px, 6 точек 2 × 2, слева 8 px</text>
<text x="518" y="966" fill="#a8aeb8" font-size="11" font-weight="400" >порог — 3 px; pointerdown → setPointerCapture</text>
<text x="518" y="988" fill="#a8aeb8" font-size="11" font-weight="400" >движение — 1:1, целые px, содержимое статично</text>
<text x="518" y="1010" fill="#a8aeb8" font-size="11" font-weight="400" >двойной щелчок / Home — вернуть по центру</text>
<text x="518" y="1032" fill="'Cascadia Mono','Consolas',monospace" font-size="10" font-weight="400" >uiStore v4: windows.node { x, y }, windows.folder</text>
<text x="518" y="1054" fill="#a8aeb8" font-size="11" font-weight="400" >запись — на pointerup и после стрелок (200 ms)</text>
<text x="518" y="1076" fill="#a8aeb8" font-size="11" font-weight="400" >позиция общая для узлов, своя для типа окна</text>
<text x="518" y="1104" fill="#626974" font-size="10.5" font-weight="400" >resize / orientationchange — пересчёт и сохранение;</text>
<text x="518" y="1120" fill="#626974" font-size="10.5" font-weight="400" >за краем только шапки не бывает: кламп 8 px.</text>

<rect x="960" y="892" width="440" height="238" rx="12" fill="#1b1e24" stroke="#2a2f37"/>
<text x="978" y="918" fill="#e9ebee" font-size="13" font-weight="700" >③ Состояния и клавиатура</text>
<text x="978" y="944" fill="#a8aeb8" font-size="11" font-weight="400" >открыто по центру · наведение на ручку (grab)</text>
<text x="978" y="966" fill="#a8aeb8" font-size="11" font-weight="400" >перетаскивание (grabbing) · перемещено и сохранено</text>
<text x="978" y="988" fill="#a8aeb8" font-size="11" font-weight="400" >у края — прижато · узкий экран — 100vw − 16</text>
<text x="978" y="1010" fill="#a8aeb8" font-size="11" font-weight="400" >свёрнуто — пилюля 220 × 36, схема видна</text>
<text x="978" y="1032" fill="#a8aeb8" font-size="11" font-weight="400" >правки не сохранены — «не сохранено: N поля»</text>
<text x="978" y="1054" fill="#a8aeb8" font-size="11" font-weight="400" >закрытие с правками — подтверждение 80</text>
<text x="978" y="1084" fill="#a8aeb8" font-size="11" font-weight="400" >Tab → ручка → вкладки → поля → линейка</text>
<text x="978" y="1106" fill="#a8aeb8" font-size="11" font-weight="400" >стрелки — 8 px, Shift — 1 px, Home — по центру</text>
<text x="978" y="1128" fill="#a8aeb8" font-size="11" font-weight="400" >Esc — отмена перетаскивания или закрытие; aria-live</text>

