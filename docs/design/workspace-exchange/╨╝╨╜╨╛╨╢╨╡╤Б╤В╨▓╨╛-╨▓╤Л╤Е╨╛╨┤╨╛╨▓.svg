<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#f8fafc"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Множество выходов во вне: каждая папка — свой портал</text>

  <!-- наше множество -->
  <rect x="20" y="70" width="330" height="470" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="36" y="96" font-size="14" font-weight="700" fill="#334155">структура (наше множество)</text>

  <!-- оркестратор -->
  <rect x="40" y="116" width="190" height="50" rx="8" fill="#0ea5e9"/>
  <text x="135" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">координатор</text>
  <text x="135" y="156" text-anchor="middle" font-size="11" fill="#e0f2fe">оркестратор</text>

  <!-- внутренние агенты -->
  <g font-size="11" fill="#0f172a">
    <rect x="40" y="196" width="88" height="42" rx="6" fill="#e2e8f0"/>
    <text x="84" y="221" text-anchor="middle">worker</text>
    <rect x="142" y="196" width="88" height="42" rx="6" fill="#e2e8f0"/>
    <text x="186" y="221" text-anchor="middle">judge</text>
    <rect x="40" y="254" width="88" height="42" rx="6" fill="#e2e8f0"/>
    <text x="84" y="279" text-anchor="middle">critic</text>
    <rect x="142" y="254" width="88" height="42" rx="6" fill="#e2e8f0"/>
    <text x="186" y="279" text-anchor="middle">designer</text>
  </g>
  <text x="135" y="326" text-anchor="middle" font-size="10" fill="#64748b">внутри множества — рёбра</text>
  <text x="135" y="340" text-anchor="middle" font-size="10" fill="#64748b">delegate / review / report</text>

  <!-- граница -->
  <line x1="360" y1="70" x2="360" y2="540" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="372" y="90" font-size="11" fill="#64748b">граница воркспейса</text>

  <!-- folder-1 -->
  <g>
    <rect x="390" y="110" width="170" height="130" rx="8" fill="#fff" stroke="#10b981" stroke-width="2"/>
    <text x="475" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">folder-1 · папка</text>
    <text x="400" y="152" font-size="10.5" fill="#334155">box: coordination</text>
    <text x="400" y="168" font-size="10.5" fill="#334155">contract.md · Rev 3</text>
    <text x="400" y="184" font-size="10.5" fill="#334155">участники: structure, workflow</text>
    <text x="400" y="200" font-size="10.5" fill="#059669">обмен: включён</text>
  </g>

  <!-- folder-2 -->
  <g>
    <rect x="390" y="300" width="170" height="130" rx="8" fill="#fff" stroke="#10b981" stroke-width="2"/>
    <text x="475" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">folder-2 · папка</text>
    <text x="400" y="342" font-size="10.5" fill="#334155">box: coordination-school</text>
    <text x="400" y="358" font-size="10.5" fill="#334155">contract.md · Rev 1</text>
    <text x="400" y="374" font-size="10.5" fill="#334155">участники: structure, school</text>
    <text x="400" y="390" font-size="10.5" fill="#f59e0b">обмен: приглашение</text>
  </g>

  <!-- внешние воркспейсы -->
  <rect x="620" y="110" width="200" height="130" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="720" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">воркспейс workflow</text>
  <text x="720" y="156" text-anchor="middle" font-size="11" fill="#b45309">координатор workflow</text>
  <text x="720" y="176" text-anchor="middle" font-size="10" fill="#b45309">(второй выход портала)</text>

  <rect x="620" y="300" width="200" height="130" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="720" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">воркспейс school</text>
  <text x="720" y="346" text-anchor="middle" font-size="11" fill="#b45309">координатор school</text>
  <text x="720" y="366" text-anchor="middle" font-size="10" fill="#b45309">(приглашён, ждёт квитанцию)</text>

  <!-- связи: оркестратор -> папки -->
  <line x1="230" y1="141" x2="388" y2="160" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="230" y1="141" x2="388" y2="355" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="300" y="140" font-size="10" fill="#64748b">peer</text>
  <text x="300" y="300" font-size="10" fill="#64748b">peer</text>

  <!-- связи: папки <-> внешние -->
  <line x1="562" y1="175" x2="618" y2="175" stroke="#0ea5e9" stroke-width="2" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="590" y="166" font-size="10" fill="#0ea5e9" text-anchor="middle">обмен</text>
  <line x1="562" y1="365" x2="618" y2="365" stroke="#0ea5e9" stroke-width="2" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="590" y="356" font-size="10" fill="#0ea5e9" text-anchor="middle">обмен</text>

  <!-- легенда -->
  <g font-size="11" fill="#334155">
    <rect x="30" y="560" width="360" height="44" rx="8" fill="#fff" stroke="#e2e8f0"/>
    <line x1="46" y1="582" x2="86" y2="582" stroke="#64748b" stroke-dasharray="5 4"/>
    <text x="96" y="586">связь с оркестратором (peer)</text>
    <line x1="250" y1="582" x2="290" y2="582" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="300" y="586">обмен писем</text>
  </g>
</svg>