<text x="196" y="33" fill="#626974" font-size="13" font-weight="400" >/</text>
<text x="212" y="33" fill="#a8aeb8" font-size="13" font-weight="400" >дизайн · UI-эргономика панели</text>
<text x="1400" y="33" fill="#626974" font-size="12" font-weight="400" text-anchor="end">Задание 0333 · макет 4 из 4 · v1</text>

<text x="40" y="94" fill="#e9ebee" font-size="30" font-weight="600" >04 · Назначение связи: source → target и предпросмотр</text>
<text x="40" y="122" fill="#626974" font-size="13" font-weight="400" >Макет 4 из 4 · раздел 4 спеки docs/design/ui-ergonomics/2026-11-22-ergonomics.md · на утверждение заказчику</text>

<rect x="40" y="140" width="1360" height="108" rx="12" fill="#1b1e24" stroke="#2a2f37"/>
<text x="58" y="168" fill="#4d7cf3" font-size="14" font-weight="700" >Что утверждаем</text>
<text x="58" y="194" fill="#e9ebee" font-size="13" font-weight="400" >1. Карточка «Новая связь» min(520 px, 100 %): source и target — два видимых select с подписями и кнопкой обмена «⇄» 28 × 28; направление не прячется за «от/к».</text>
<text x="58" y="216" fill="#e9ebee" font-size="13" font-weight="400" >2. Стрелка всегда идёт от source к target — ровно как from/to в файле; смысл вида подписан словами и может читаться наоборот (review: target проверяет source).</text>
<text x="58" y="238" fill="#e9ebee" font-size="13" font-weight="400" >3. Полоса предпросмотра 48 px, список существующих связей узла до создания, кнопка с полной подписью «Создать: coordinator → worker (delegate)».</text>

<text x="40" y="272" fill="#e9ebee" font-size="18" font-weight="700" >Карточка «Новая связь» — масштаб 1.5, реальные размеры 520 px</text>
<rect x="40" y="292" width="780" height="532" rx="12" fill="#1b1e24" stroke="#2a2f37"/>
<text x="58" y="322" fill="#e9ebee" font-size="18" font-weight="700" >Новая связь</text>
<text x="802" y="322" fill="#626974" font-size="10.5" font-weight="400" text-anchor="end">пишется в файл: from = source, to = target</text>
<text x="58" y="360" fill="#a8aeb8" font-size="11.5" font-weight="600" >source — отсюда (узел-источник)</text>
<text x="462" y="360" fill="#a8aeb8" font-size="11.5" font-weight="600" >target — сюда (узел-цель)</text>
<rect x="58" y="368" width="342" height="42" rx="8" fill="#232830" stroke="#3c434f"/>
<text x="72" y="395" fill="#e9ebee" font-size="15" font-weight="600" font-family="'Cascadia Mono','Consolas',monospace">coordinator</text>
<text x="382" y="395" fill="#a8aeb8" font-size="12" font-weight="400" >▾</text>
<rect x="410" y="368" width="42" height="42" rx="8" fill="#262b33" stroke="#3c434f"/>
<text x="431" y="396" fill="#4d7cf3" font-size="18" font-weight="600" text-anchor="middle">⇄</text>
<rect x="462" y="368" width="342" height="42" rx="8" fill="#232830" stroke="#3c434f"/>
<text x="476" y="395" fill="#e9ebee" font-size="15" font-weight="600" font-family="'Cascadia Mono','Consolas',monospace">worker</text>
<text x="786" y="395" fill="#a8aeb8" font-size="12" font-weight="400" >▾</text>

<text x="58" y="446" fill="#a8aeb8" font-size="11.5" font-weight="600" >вид связи</text>
<rect x="58" y="454" width="179" height="42" rx="8" fill="#262b33" stroke="#4d7cf3" stroke-width="1.5"/>
<text x="147.5" y="481" fill="#e9ebee" font-size="12.5" font-weight="600" text-anchor="middle">поручение</text>
<rect x="246" y="454" width="179" height="42" rx="8" fill="none" stroke="#3c434f"/>
<text x="335.5" y="481" fill="#a8aeb8" font-size="12.5" font-weight="400" text-anchor="middle">проверка</text>
<rect x="434" y="454" width="179" height="42" rx="8" fill="none" stroke="#3c434f"/>
<text x="523.5" y="481" fill="#a8aeb8" font-size="12.5" font-weight="400" text-anchor="middle">возврат</text>
<rect x="622" y="454" width="179" height="42" rx="8" fill="none" stroke="#3c434f"/>
<text x="711.5" y="481" fill="#a8aeb8" font-size="12.5" font-weight="400" text-anchor="middle">равные</text>
<text x="147.5" y="514" fill="#4d7cf3" font-size="10.5" font-weight="400" text-anchor="middle">delegate</text>
<text x="335.5" y="514" fill="#626974" font-size="10.5" font-weight="400" text-anchor="middle">review</text>
<text x="523.5" y="514" fill="#626974" font-size="10.5" font-weight="400" text-anchor="middle">report</text>
<text x="711.5" y="514" fill="#626974" font-size="10.5" font-weight="400" text-anchor="middle">peer</text>

<rect x="58" y="530" width="744" height="72" rx="9" fill="#262b33" stroke="#3c434f"/>
<rect x="76" y="548" width="198" height="36" rx="8" fill="#1b1e24" stroke="#2a2f37"/>
<text x="88" y="565" fill="#e9ebee" font-size="13" font-weight="600" font-family="'Cascadia Mono','Consolas',monospace">coordinator</text>
<text x="88" y="579" fill="#626974" font-size="9.5" font-weight="400" >координатор</text>
<rect x="588" y="548" width="198" height="36" rx="8" fill="#1b1e24" stroke="#2a2f37"/>
<text x="600" y="565" fill="#e9ebee" font-size="13" font-weight="600" font-family="'Cascadia Mono','Consolas',monospace">worker</text>
<text x="600" y="579" fill="#626974" font-size="9.5" font-weight="400" >воркер</text>
<line x1="286" y1="566" x2="576" y2="566" stroke="#4d7cf3" stroke-width="2" marker-end="url(#arrow)"/>
<text x="431" y="559" fill="#4d7cf3" font-size="12" font-weight="600" text-anchor="middle">delegate</text>
<text x="58" y="626" fill="#a8aeb8" font-size="13" font-weight="400" >source: coordinator передаёт работу worker</text>

<text x="58" y="660" fill="#e9ebee" font-size="11.5" font-weight="700" >Связи этого узла (2)</text>
<text x="58" y="686" fill="#a8aeb8" font-size="12" font-weight="400" >→ worker · delegate · поручает работу</text>
<text x="58" y="718" fill="#a8aeb8" font-size="12" font-weight="400" >← judge · review · приёмщик проверяет</text>

<rect x="58" y="744" width="500" height="42" rx="8" fill="#4d7cf3"/>
<text x="308" y="771" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle">Создать: coordinator → worker (delegate)</text>
<rect x="570" y="744" width="110" height="42" rx="8" fill="none" stroke="#3c434f"/>
<text x="625" y="771" fill="#a8aeb8" font-size="12.5" font-weight="600" text-anchor="middle">Отмена</text>
<text x="58" y="812" fill="#626974" font-size="10.5" font-weight="400" >Подпись собрана из source, target и вида — нажать «не поняв, что создаётся» нельзя.</text>

<text x="850" y="320" fill="#e9ebee" font-size="15" font-weight="700" >Стрелка всегда source → target</text>
<text x="850" y="340" fill="#626974" font-size="11.5" font-weight="400" >Смысл вида может читаться наоборот — стрелка нет. Смена вида не меняет выбранные узлы.</text>
<rect x="850" y="352" width="550" height="100" rx="12" fill="#1b1e24" stroke="#2a2f37"/><text x="866" y="376" fill="#4d7cf3" font-size="13" font-weight="700" font-family="'Cascadia Mono','Consolas',monospace">delegate</text><text x="946" y="376" fill="#a8aeb8" font-size="11.5" font-weight="400" >worker получает работу от coordinator</text><rect x="866" y="392" width="130" height="30" rx="7" fill="#262b33" stroke="#2a2f37"/><text x="876" y="412" fill="#e9ebee" font-size="9.5" font-weight="600" font-family="'Cascadia Mono','Consolas',monospace">coordinator</text><rect x="1254" y="392" width="130" height="30" rx="7" fill="#262b33" stroke="#2a2f37"/><text x="1264" y="412" fill="#e9ebee" font-size="9.5" font-weight="600" font-family="'Cascadia Mono','Consolas',monospace">worker</text><line x1="1004" y1="407" x2="1246" y2="407" stroke="#4d7cf3" stroke-width="2" marker-end="url(#arrow)"/><text x="866" y="446" fill="#626974" font-size="8.5" font-weight="400" >source</text><text x="1254" y="446" fill="#626974" font-size="8.5" font-weight="400" >target</text>
<rect x="850" y="462" width="550" height="100" rx="12" fill="#1b1e24" stroke="#2a2f37"/><text x="866" y="486" fill="#e0a33e" font-size="13" font-weight="700" font-family="'Cascadia Mono','Consolas',monospace">review</text><text x="946" y="486" fill="#a8aeb8" font-size="11.5" font-weight="400" >worker проверяет работу coordinator</text><rect x="866" y="502" width="130" height="30" rx="7" fill="#262b33" stroke="#2a2f37"/><text x="876" y="522" fill="#e9ebee" font-size="9.5" font-weight="600" font-family="'Cascadia Mono','Consolas',monospace">coordinator</text><rect x="1254" y="502" width="130" height="30" rx="7" fill="#262b33" stroke="#2a2f37"/><text x="1264" y="522" fill="#e9ebee" font-size="9.5" font-weight="600" font-family="'Cascadia Mono','Consolas',monospace">worker</text><line x1="1004" y1="517" x2="1246" y2="517" stroke="#e0a33e" stroke-width="2" marker-end="url(#arrowWarn)"/><text x="866" y="556" fill="#626974" font-size="8.5" font-weight="400" >source</text><text x="1254" y="556" fill="#626974" font-size="8.5" font-weight="400" >target</text>
<rect x="850" y="572" width="550" height="100" rx="12" fill="#1b1e24" stroke="#2a2f37"/><text x="866" y="596" fill="#31c46e" font-size="13" font-weight="700" font-family="'Cascadia Mono','Consolas',monospace">report</text><text x="946" y="596" fill="#a8aeb8" font-size="11.5" font-weight="400" >worker принимает результат coordinator</text><rect x="866" y="612" width="130" height="30" rx="7" fill="#262b33" stroke="#2a2f37"/><text x="876" y="632" fill="#e9ebee" font-size="9.5" font-weight="600" font-family="'Cascadia Mono','Consolas',monospace">coordinator</text><rect x="1254" y="612" width="130" height="30" rx="7" fill="#262b33" stroke="#2a2f37"/><text x="1264" y="632" fill="#e9ebee" font-size="9.5" font-weight="600" font-family="'Cascadia Mono','Consolas',monospace">worker</text><line x1="1004" y1="627" x2="1246" y2="627" stroke="#31c46e" stroke-width="2" marker-end="url(#arrowSec)"/><text x="866" y="666" fill="#626974" font-size="8.5" font-weight="400" >source</text><text x="1254" y="666" fill="#626974" font-size="8.5" font-weight="400" >target</text>
<rect x="850" y="682" width="550" height="100" rx="12" fill="#1b1e24" stroke="#2a2f37"/><text x="866" y="706" fill="#a8aeb8" font-size="13" font-weight="700" font-family="'Cascadia Mono','Consolas',monospace">peer</text><text x="946" y="706" fill="#a8aeb8" font-size="11.5" font-weight="400" >равные: coordinator и worker без направления</text><rect x="866" y="722" width="130" height="30" rx="7" fill="#262b33" stroke="#2a2f37"/><text x="876" y="742" fill="#e9ebee" font-size="9.5" font-weight="600" font-family="'Cascadia Mono','Consolas',monospace">coordinator</text><rect x="1254" y="722" width="130" height="30" rx="7" fill="#262b33" stroke="#2a2f37"/><text x="1264" y="742" fill="#e9ebee" font-size="9.5" font-weight="600" font-family="'Cascadia Mono','Consolas',monospace">worker</text><line x1="1004" y1="737" x2="1246" y2="737" stroke="#a8aeb8" stroke-width="2" stroke-dasharray="7 5"/><text x="1125" y="732" fill="#a8aeb8" font-size="14" font-weight="600" text-anchor="middle">↔</text><text x="866" y="776" fill="#626974" font-size="8.5" font-weight="400" >source</text><text x="1254" y="776" fill="#626974" font-size="8.5" font-weight="400" >target</text>

<rect x="850" y="796" width="550" height="334" rx="12" fill="#1b1e24" stroke="#2a2f37"/>
<text x="868" y="822" fill="#e9ebee" font-size="13" font-weight="700" >Проверки до записи в файл</text>
<text x="868" y="850" fill="#e9ebee" font-size="10.5" font-weight="700" >source = target · красная рамка</text>
<text x="868" y="866" fill="#e5484d" font-size="9.5" font-weight="400" >«нельзя связать узел с собой» · disabled</text>
<text x="1126" y="850" fill="#e9ebee" font-size="10.5" font-weight="700" >уже связана тем же видом</text>
<text x="1126" y="866" fill="#e0a33e" font-size="9.5" font-weight="400" >«Такая связь уже есть: A → B (delegate)»</text>
<text x="868" y="906" fill="#e9ebee" font-size="10.5" font-weight="700" >пара связана другим видом</text>
<text x="868" y="922" fill="#e0a33e" font-size="9.5" font-weight="400" >«Между A и B уже есть review» · активна</text>
<text x="1126" y="906" fill="#e9ebee" font-size="10.5" font-weight="700" >peer уже есть</text>
<text x="1126" y="922" fill="#e0a33e" font-size="9.5" font-weight="400" >«Равная связь уже есть» · disabled</text>
<text x="868" y="962" fill="#e9ebee" font-size="10.5" font-weight="700" >нет target (один узел)</text>
<text x="868" y="978" fill="#a8aeb8" font-size="9.5" font-weight="400" >карточка не открывается: «Других узлов нет»</text>
<text x="1126" y="962" fill="#e9ebee" font-size="10.5" font-weight="700" >папка как source</text>
<text x="1126" y="978" fill="#a8aeb8" font-size="9.5" font-weight="400" >«Связь» недоступна; причина в title</text>
<line x1="868" y1="994" x2="1382" y2="994" stroke="#2a2f37"/>
<text x="868" y="1018" fill="#e9ebee" font-size="11" font-weight="700" >Клавиатура и aria</text>
<text x="868" y="1040" fill="#a8aeb8" font-size="10" font-weight="400" >Открытие — фокус на select source; Tab: source → «⇄» → target → вид → Создать.</text>
<text x="868" y="1060" fill="#a8aeb8" font-size="10" font-weight="400" >Группа вида — ←/→, aria-checked; Enter/Space на «⇄» — поменять направление.</text>
<text x="868" y="1080" fill="#a8aeb8" font-size="10" font-weight="400" >Esc — «Отмена», фокус на «Связь»; строки списка — roving tabindex.</text>
<text x="868" y="1100" fill="#a8aeb8" font-size="9.5" font-weight="400" >aria: role="group" · полоса role="img" · строка успеха role="status"</text>

<text x="40" y="872" fill="#e9ebee" font-size="13" font-weight="700" >Полоса предпросмотра: ошибки и равная связь</text>
<rect x="40" y="884" width="780" height="72" rx="10" fill="#262b33" stroke="#e5484d" stroke-width="1.5"/>
<text x="58" y="914" fill="#e5484d" font-size="12" font-weight="700" >нельзя связать узел с собой</text>
<text x="58" y="936" fill="#a8aeb8" font-size="10.5" font-weight="400" >source = target · «Создать» disabled · рамка полосы красная</text>
<line x1="420" y1="920" x2="600" y2="920" stroke="#e5484d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="650" y="925" fill="#e5484d" font-size="11" font-weight="600" text-anchor="middle">coordinator → coordinator</text>

<rect x="40" y="968" width="780" height="72" rx="10" fill="#262b33" stroke="#e0a33e" stroke-width="1.5"/>
<text x="58" y="998" fill="#e0a33e" font-size="12" font-weight="700" >Такая связь уже есть: coordinator → worker (delegate)</text>
<text x="58" y="1020" fill="#a8aeb8" font-size="10.5" font-weight="400" >жёлтая строка · «Создать» disabled · дубль не создаётся</text>
<text x="740" y="998" fill="#e0a33e" font-size="10.5" font-weight="600" text-anchor="end">disabled</text>

<rect x="40" y="1052" width="780" height="72" rx="10" fill="#262b33" stroke="#3c434f"/>
<text x="58" y="1082" fill="#a8aeb8" font-size="12" font-weight="700" >равные: coordinator и worker сотрудничают без направления</text>
<text x="58" y="1104" fill="#626974" font-size="10.5" font-weight="400" >пунктир 4 3 · без наконечников · «⇄» недоступна: менять нечего</text>
<line x1="520" y1="1088" x2="700" y2="1088" stroke="#a8aeb8" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="740" y="1093" fill="#a8aeb8" font-size="13" font-weight="600" text-anchor="middle">↔</text>

