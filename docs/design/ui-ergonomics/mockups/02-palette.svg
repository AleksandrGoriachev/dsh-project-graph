<text x="389.5" y="1080" fill="#a8aeb8" font-size="12" font-weight="700" text-anchor="middle">?</text>
<line x1="60" y1="1104" x2="423" y2="1104" stroke="#3c434f"/>
<text x="60" y="1122" fill="#626974" font-size="10.5" font-weight="400" >низ палитры: 12 px до следующего блока · 24 px до низа окна</text>

<rect x="470" y="292" width="930" height="90" rx="12" fill="#1b1e24" stroke="#2a2f37"/>
<text x="486" y="318" fill="#e9ebee" font-size="13" font-weight="700" >Высота: H = clamp(320 px, calc(100vh − 192 px), 560 px)</text>
<text x="486" y="342" fill="#a8aeb8" font-size="11.5" font-weight="400" >При окне ≥ 752 px — H = 560 px. При окне &lt; 512 px — H = 320 px (минимум), страница прокручивается, но у палитры остаётся свой scroll.</text>
<text x="486" y="364" fill="#a8aeb8" font-size="11.5" font-weight="400" >Список при H = 560: 560 − 40 (шапка) − 36 (поиск) − 40 (подсказка) = 444 px. При H = 320 — 204 px (одна карточка целиком + заголовки).</text>

<rect x="470" y="394" width="450" height="120" rx="12" fill="#1b1e24" stroke="#2a2f37"/>
<text x="486" y="418" fill="#e9ebee" font-size="13" font-weight="700" >Слоты и прокрутка (H = 560)</text>
<text x="486" y="442" fill="#a8aeb8" font-size="11.5" font-weight="400" >Шапка</text><text x="620" y="442" fill="#e9ebee" font-size="11.5" font-weight="400" >40 px · нет прокрутки · «Библиотека узлов» + счётчик</text>
<text x="486" y="464" fill="#a8aeb8" font-size="11.5" font-weight="400" >Поиск</text><text x="620" y="464" fill="#e9ebee" font-size="11.5" font-weight="400" >36 px · нет прокрутки · поле 28 px + зазор 8 px</text>
<text x="486" y="486" fill="#a8aeb8" font-size="11.5" font-weight="400" >Список</text><text x="620" y="486" fill="#4d7cf3" font-size="11.5" font-weight="400" >444 px · ДА · overflow-y: auto, scrollbar 8 px</text>
<text x="486" y="508" fill="#a8aeb8" font-size="11.5" font-weight="400" >Подсказка</text><text x="620" y="508" fill="#e9ebee" font-size="11.5" font-weight="400" >40 px · нет прокрутки · 2 строки + «?» 16 × 16</text>

<rect x="940" y="394" width="460" height="120" rx="12" fill="#1b1e24" stroke="#2a2f37"/>
<text x="956" y="418" fill="#e9ebee" font-size="13" font-weight="700" >Почему 192 px</text>
<text x="956" y="442" fill="#a8aeb8" font-size="11.5" font-weight="400" >96 px сверху: полоса 38 + зазор 10 + «Добавить узел» 40 + зазор 8.</text>
<text x="956" y="464" fill="#a8aeb8" font-size="11.5" font-weight="400" >96 px снизу: низ палитры не упирается в край, остаётся место подсказке/легенде.</text>
<text x="956" y="486" fill="#a8aeb8" font-size="11.5" font-weight="400" >H &lt; 400 px — подсказка в одну строку; список всё равно прокручивается.</text>
<text x="956" y="508" fill="#626974" font-size="11" font-weight="400" >Меньше 320 px не опускаемся: палитра остаётся читаемой.</text>

<rect x="470" y="526" width="930" height="140" rx="12" fill="#1b1e24" stroke="#2a2f37"/>
<text x="486" y="550" fill="#e9ebee" font-size="13" font-weight="700" >Свой scroll: правила, иначе дефект возвращается</text>
<text x="486" y="576" fill="#a8aeb8" font-size="11.5" font-weight="400" >1. box-sizing: border-box; overflow: hidden на коробке.</text>
<text x="486" y="598" fill="#a8aeb8" font-size="11.5" font-weight="400" >2. У списка min-height: 0 — только это разрешает сжатие.</text>
<text x="486" y="620" fill="#a8aeb8" font-size="11.5" font-weight="400" >3. overflow-y: auto; overscroll-behavior: contain.</text>
<text x="486" y="642" fill="#a8aeb8" font-size="11.5" font-weight="400" >4. scrollbar-gutter: stable; полоса 8 px, цвет T.border2.</text>
<line x1="770" y1="560" x2="770" y2="650" stroke="#2a2f37"/>
<text x="786" y="576" fill="#a8aeb8" font-size="11.5" font-weight="400" >5. padding: 0 2px 12px 0 — последняя карточка не упирается.</text>
<text x="786" y="598" fill="#a8aeb8" font-size="11.5" font-weight="400" >6. scroll-margin-top: 28 px; scroll-margin-bottom: 12 px.</text>
<text x="786" y="620" fill="#a8aeb8" font-size="11.5" font-weight="400" >7. 12 px до следующего блока, ≥ 24 px до низа окна.</text>
<text x="786" y="642" fill="#a8aeb8" font-size="11.5" font-weight="400" >8. Высота карточки не зависит от H; обрезка по низу запрещена.</text>

<text x="470" y="690" fill="#e9ebee" font-size="13" font-weight="700" >Сейчас и после: куда уходит палитра (схема, не в масштабе)</text>
<rect x="470" y="702" width="450" height="158" rx="10" fill="#101216" stroke="#2a2f37"/>
<text x="486" y="724" fill="#626974" font-size="10" font-weight="700" letter-spacing="0.08em">СЕЙЧАС · высота не задана</text>
<rect x="486" y="734" width="418" height="112" rx="6" fill="#20242b" stroke="#2a2f37"/>
<rect x="486" y="734" width="418" height="20" rx="6" fill="#0f1013"/>
<rect x="498" y="762" width="118" height="84" rx="8" fill="#1b1e24" stroke="#e5484d" stroke-dasharray="4 4"/>
<rect x="506" y="768" width="102" height="20" rx="4" fill="#262b33"/><rect x="506" y="794" width="102" height="20" rx="4" fill="#262b33"/><rect x="506" y="820" width="102" height="20" rx="4" fill="#262b33"/>
<text x="632" y="786" fill="#a8aeb8" font-size="11" font-weight="400" >12 карточек ≈ 1780 px</text>
<text x="632" y="806" fill="#a8aeb8" font-size="11" font-weight="400" >нижние карточки и подсказка</text>
<text x="632" y="826" fill="#e5484d" font-size="11" font-weight="400" >уходят за край окна</text>
<text x="486" y="854" fill="#626974" font-size="10" font-weight="400" >страница прокручивается целиком — у палитры нет своей границы</text>

<rect x="940" y="702" width="460" height="158" rx="10" fill="#101216" stroke="#2a2f37"/>
<text x="956" y="724" fill="#4d7cf3" font-size="10" font-weight="700" letter-spacing="0.08em">ПОСЛЕ · H = 560 px, свой scroll</text>
<rect x="956" y="734" width="428" height="112" rx="6" fill="#20242b" stroke="#2a2f37"/>
<rect x="956" y="734" width="428" height="20" rx="6" fill="#0f1013"/>
<rect x="968" y="762" width="118" height="84" rx="8" fill="#1b1e24" stroke="#31c46e"/>
<rect x="968" y="762" width="118" height="13" rx="4" fill="#262b33"/>
<text x="974" y="773" fill="#626974" font-size="7.5" font-weight="400" >40 / 36</text>
<rect x="976" y="780" width="102" height="46" rx="4" fill="#262b33"/>
<rect x="1073" y="780" width="6" height="46" rx="3" fill="#3c434f"/>
<text x="974" y="840" fill="#626974" font-size="7.5" font-weight="400" >40 · подсказка</text>
<text x="1100" y="786" fill="#a8aeb8" font-size="11" font-weight="400" >коробка 250 × 560 px</text>
<text x="1100" y="806" fill="#a8aeb8" font-size="11" font-weight="400" >список 444 px — свой scroll</text>
<text x="1100" y="826" fill="#31c46e" font-size="11" font-weight="400" >низ палитры виден</text>
<text x="956" y="854" fill="#626974" font-size="10" font-weight="400" >следующий блок через 12 px; страница не прячет палитру</text>
<rect x="470" y="882" width="930" height="222" rx="12" fill="#1b1e24" stroke="#2a2f37"/>
<text x="486" y="906" fill="#e9ebee" font-size="13" font-weight="700" >Состояния палитры и клавиатура</text>
<text x="486" y="930" fill="#a8aeb8" font-size="10.5" font-weight="400" >Развёрнута — шапка, поиск, список, подсказка.</text>
<text x="486" y="952" fill="#a8aeb8" font-size="10.5" font-weight="400" >Свёрнута — корешок 44 px, 3 иконки 32 × 32.</text>
<text x="486" y="974" fill="#a8aeb8" font-size="10.5" font-weight="400" >Поиск — «4/12», группы развёрнуты, пустые скрыты.</text>
<text x="486" y="996" fill="#a8aeb8" font-size="10.5" font-weight="400" >Ничего не найдено — строка + «Сбросить».</text>
<text x="486" y="1018" fill="#a8aeb8" font-size="10.5" font-weight="400" >Группа свёрнута — только заголовок 28 px.</text>
<text x="486" y="1040" fill="#a8aeb8" font-size="10.5" font-weight="400" >Карточка в руке — палитра не меняет высоту.</text>
<text x="486" y="1062" fill="#a8aeb8" font-size="10.5" font-weight="400" >Ошибка чтения — палитра не рисуется.</text>
<line x1="768" y1="920" x2="768" y2="1076" stroke="#2a2f37"/>
<text x="786" y="930" fill="#a8aeb8" font-size="10.5" font-weight="400" >Tab — шапка → поиск → заголовки → карточки открытых групп.</text>
<text x="786" y="952" fill="#a8aeb8" font-size="10.5" font-weight="400" >«/» — фокус в поиск; Esc — очистить, затем выйти.</text>
<text x="786" y="974" fill="#a8aeb8" font-size="10.5" font-weight="400" >Стрелки — roving tabindex; Home/End — крайние.</text>
<text x="786" y="996" fill="#a8aeb8" font-size="10.5" font-weight="400" >PageDown — высота списка минус 40 px; Enter/Space — взять.</text>
<text x="786" y="1018" fill="#a8aeb8" font-size="10.5" font-weight="400" >role="list", карточка — listitem, заголовок — role="button".</text>
<text x="786" y="1040" fill="#a8aeb8" font-size="10.5" font-weight="400" >заголовок: aria-expanded, aria-controls="pg-group-&lt;id&gt;".</text>
<text x="786" y="1062" fill="#a8aeb8" font-size="10.5" font-weight="400" >Фокус 2 px T.link через box-shadow — overflow не обрезает.</text>
