<text x="40" y="94" fill="#e9ebee" font-size="30" font-weight="600" >03 · Окно настроек: двигается и показывает изменения</text>
<text x="40" y="122" fill="#626974" font-size="13" font-weight="400" >Макет 3 из 4 · раздел 3 спеки docs/design/ui-ergonomics/2026-11-22-ergonomics.md · на утверждение заказчику</text>

<rect x="40" y="140" width="1360" height="108" rx="12" fill="#1b1e24" stroke="#2a2f37"/>
<text x="58" y="168" fill="#4d7cf3" font-size="14" font-weight="700" >Что утверждаем</text>
<text x="58" y="194" fill="#e9ebee" font-size="13" font-weight="400" >1. Окно 560 × 520 px остаётся модальным, но двигается за всю шапку 37 px: ручка 12 × 12 (6 точек), курсор grab/grabbing, порог 3 px, 1:1 к курсору.</text>
<text x="58" y="216" fill="#e9ebee" font-size="13" font-weight="400" >2. Подложка светлее — rgba(20,22,26,0.22), схема за окном читается; позиция хранится в uiStore v4 (windows.node / windows.folder), клампится 8 px от краёв.</text>
<text x="58" y="238" fill="#e9ebee" font-size="13" font-weight="400" >3. Изменения видны без закрытия: строка «сохранено: … · схема обновлена», подсветка узла 2 px T.success 1200 ms, кнопка «Свернуть» уводит окно в пилюлю 220 × 36.</text>

