<text x="40" y="94" fill="#e9ebee" font-size="30" font-weight="600" >02 · Палитра узлов: своя высота и свой scroll</text>
<text x="40" y="122" fill="#626974" font-size="13" font-weight="400" >Макет 2 из 4 · раздел 2 спеки docs/design/ui-ergonomics/2026-11-22-ergonomics.md · на утверждение заказчику</text>

<rect x="40" y="140" width="1360" height="108" rx="12" fill="#1b1e24" stroke="#2a2f37"/>
<text x="58" y="168" fill="#4d7cf3" font-size="14" font-weight="700" >Что утверждаем</text>
<text x="58" y="194" fill="#e9ebee" font-size="13" font-weight="400" >1. Высота палитры ограничена: H = clamp(320 px, calc(100vh − 192 px), 560 px); коробка overflow: hidden, ширина 250 px не меняется.</text>
<text x="58" y="216" fill="#e9ebee" font-size="13" font-weight="400" >2. Прокручивается только список: flex: 1 1 auto + min-height: 0 + overflow-y: auto. Шапка 40 px, поиск 36 px, подсказка 40 px — вне прокрутки.</text>
<text x="58" y="238" fill="#e9ebee" font-size="13" font-weight="400" >3. Нижняя граница: padding 0 2px 12px 0, 12 px до следующего блока; карточка не обрезается по низу, H не зависит от содержимого.</text>

<text x="40" y="272" fill="#e9ebee" font-size="18" font-weight="700" >Палитра 250 × H: масштаб 1.45, реальные размеры в px</text>
